services:
  # -----------------------------------------------------------
  # PostGIS / PostgreSQL 16 Database
  # -----------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: thinkforge_db
    restart: always
    environment:
      POSTGRES_USER: thinkforge
      POSTGRES_PASSWORD: thinkforge_dev_password
      POSTGRES_DB: thinkforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkforge -d thinkforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # ThinkForge Backend API (FastAPI)
  # -----------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinkforge_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=ThinkForge API
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://thinkforge:thinkforge_dev_password@db:5432/thinkforge
      - DATABASE_SYNC_URL=postgresql+psycopg2://thinkforge:thinkforge_dev_password@db:5432/thinkforge
      - JWT_SECRET_KEY=thinkforge_super_secure_dev_jwt_secret_key_32chars!
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:8080"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  pgdata:
    driver: local
